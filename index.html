  <body class="h-full text-neutral-900 bg-neutral-50 dark:text-neutral-100 dark:bg-neutral-950">
    <div class="h-full flex flex-col" id="root"></div>
    <script>
      // https://github.com/rafgraph/spa-github-pages
      ;(({ search, pathname, hash }, history) => {
        if (search[1] === '/') {
          const decoded = search
            .slice(1)
            .split('&')
            .map((s) => s.replace(/~and~/g, '&'))
            .join('?')
          history.replaceState(null, '', pathname.slice(0, -1) + decoded + hash)
        }
      })(window.location, window.history)
    </script>
    <script src="./src/index.tsx" type="module"></script>
  </body>
