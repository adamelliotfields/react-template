<!doctype html>
<html>
  <head>
    <meta name="robots" content="noindex" />
    <script>
      // TODO: change this and vite.config.ts before deploying
      const BASE_PATH = '/react-template'
      const pathSegments = BASE_PATH.split('/').filter(Boolean).length
      const { hash, hostname, pathname, port, protocol, search } = window.location
      window.location.replace(
        protocol
          + '//' + hostname + (port ? ':' + port : '')
          + pathname.split('/').slice(0, 1 + pathSegments).join('/') + '/?/'
          + pathname.slice(1).split('/').slice(pathSegments).join('/').replace(/&/g, '~and~')
          + (search ? '&' + search.slice(1).replace(/&/g, '~and~') : '')
          + hash
      )
    </script>
  </head>
</html>
